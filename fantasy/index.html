<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca de fantasía</title><style>
body{font:16px system-ui;background:#151922;color:#eee;margin:0;padding:clamp(16px,4vw,48px)}main{max-width:1400px;margin:auto}a{color:#9ecaff}h1{font-size:2rem} .filters{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}label{display:grid;gap:5px;font-size:13px}input,select,button{font:inherit;background:#252d3a;color:#fff;border:1px solid #64748b;border-radius:7px;padding:9px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}article{background:#202632;border:1px solid #384152;border-radius:10px;padding:16px}h2{font-size:17px;margin:0 0 6px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{padding:4px 8px;border-radius:5px;font-size:12px;color:#fff}.g{background:#245ba1}.a{background:#246b49}.t{background:#963b42}.m{background:#6845a1}.p{background:#806017}.w{background:#090b10;border:1px solid #777}.muted{color:#b6c1d1;font-size:14px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #485365;vertical-align:top}.scroll{overflow:auto}</style><main><h1>Biblioteca de fantasía</h1><p class="muted">Catálogo físico · Datos del inventario Markdown de GitHub</p><p><a href="https://github.com/Enrique1987/no_technical_stuff/blob/main/knowledge/books/fantasy_library.md">Inventario original</a> · <a href="https://chatgpt.com/space/page_c8147e6795788191a7702f4544213d31">Espacio ChatGPT</a></p><div id="legend" class="tags"></div><div class="filters"><label>Buscar<input id="q" placeholder="Título, autor, saga"></label><span id="filters" style="display:contents"></span><label>Vista<select id="view"><option value="cards">Tarjetas</option><option value="table">Tabla</option></select></label><button id="reset">Limpiar filtros</button></div><p id="count" role="status">Cargando catálogo…</p><div id="results"></div></main><script>
const dimensions=[['g','Género'],['a','Ambientación'],['t','Tono'],['m','Temática'],['p','Público'],['w','Universo']];
const $=id=>document.getElementById(id);const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e};
let books=[];const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function classify(s,title){const n=normalize(s+' '+title);let x=['Sin clasificar','Sin clasificar','Sin clasificar','Sin clasificar','Sin clasificar','—'];
if(n.includes('primera ley')||n.includes('locura'))x=['Épica','Secundaria medieval','Grimdark','Poder, guerra','Adulto','—'];
if(n.includes('era de la locura'))x[1]='Secundaria industrial';
if(n.includes('tierras rojas')){x[0]='Western fantástico';x[3]='Rescate'}
if(n.includes('los heroes')){x[0]='Bélica';x[3]='Guerra'}
if(n.includes('mejor venganza')){x[0]='Aventura';x[3]='Venganza'}
if(n.includes('filos mortales'))x[0]='Relatos';
if(n.includes('los diablos'))x=['Aventura','Secundaria medieval','Oscuro, humor negro','Magia, aventura','Adulto','—'];
if(n.includes('mar quebrado'))x=['Aventura','Secundaria nórdica','Oscuro','Poder, venganza','Juvenil','—'];
if(n.includes('elfo oscuro'))x=['Espada y brujería','Secundaria subterránea','Oscuro, heroico','Identidad, supervivencia','Adulto','—'];
if(n.includes('mistborn'))x=['Épica','Secundaria','Oscuro, heroico','Magia, rebelión','Adulto','—'];
if(n.includes('warhammer'))x=['Épica','Viejo Mundo','Oscuro','Guerra','Adulto','Warhammer Fantasy'];
if(n.includes('gotrek'))x=['Espada y brujería','Viejo Mundo','Oscuro, humor negro','Aventura, monstruos','Adulto','Warhammer Fantasy'];
if(n.includes('thanquol'))x=['Espada y brujería','Viejo Mundo','Oscuro, humor negro','Intriga, no humanos','Adulto','Warhammer Fantasy'];
if(n.includes('fin de los tiempos'))x[2]='Oscuro, apocalíptico';
if(n.includes('sigmar'))x[2]='Heroico, oscuro';
if(n.includes('guardabosques'))x=['Aventura','Secundaria medieval','Heroico','Formación, amistad','Juvenil','—'];
if(n.includes('orcos'))x=['Espada y brujería','Secundaria medieval','Oscuro','Guerra, no humanos','Adulto','—'];
if(n.includes('nombre del viento')||n.includes('temor de un hombre'))x=['Épica','Secundaria medieval','Melancólico','Magia, formación','Adulto','—'];
return x}
function parse(md){let section='',headers=[];return md.split(/\r?\n/).flatMap(line=>{if(line.startsWith('## ')){section=line.slice(3);headers=[]}if(!line.startsWith('|'))return [];const c=line.split('|').slice(1,-1).map(v=>v.trim());if(c.some(v=>['Título','Libro','Ejemplar'].includes(v))){headers=c;return []}if(!headers.length||!c[0].includes('✅'))return [];const get=(...names)=>c[headers.findIndex(h=>names.includes(h))]||'';const title=get('Título','Libro','Ejemplar');if(!title)return [];return [{title,author:get('Autor'),section,rating:get('Mi nota /10'),status:c[0],reading:get('Lectura'),tags:classify(section,title)}]})}
function tags(b){const d=el('div','','tags');b.tags.forEach((v,i)=>d.append(el('span',v,'tag '+dimensions[i][0])));return d}
function render(){const q=normalize($('q').value);const filtered=books.filter(b=>normalize(b.title+' '+b.author+' '+b.section).includes(q)&&dimensions.every(([k],i)=>!$(k).value||b.tags[i].split(', ').includes($(k).value)));$('count').textContent=filtered.length+' de '+books.length+' entradas';const r=$('results');r.replaceChildren();if($('view').value==='table'){r.className='scroll';const t=el('table'),h=el('tr');['Título','Autor',...dimensions.map(d=>d[1]),'Nota','Estado'].forEach(v=>h.append(el('th',v)));const head=el('thead');head.append(h);t.append(head);const body=el('tbody');filtered.forEach(b=>{const tr=el('tr');[b.title,b.author,...b.tags,b.rating,b.status+' '+b.reading].forEach((v,i)=>{const td=el('td');td.append(i>=2&&i<8?el('span',v,'tag '+dimensions[i-2][0]):el('span',v));tr.append(td)});body.append(tr)});t.append(body);r.append(t)}else{r.className='grid';filtered.forEach(b=>{const a=el('article');a.append(el('h2',b.title),el('div',b.author+' · '+b.section,'muted'),tags(b),el('div',b.status+' '+b.reading+' · Nota: '+(b.rating||'—'),'muted'));r.append(a)})}}
async function init(){try{const res=await fetch('../knowledge/books/fantasy_library.md');if(!res.ok)throw Error('HTTP '+res.status);books=parse(await res.text());if(!books.length)throw Error('Inventario vacío o formato no reconocido');dimensions.forEach(([k,label],i)=>{ $('legend').append(el('span',label,'tag '+k));const l=el('label',label),s=el('select');s.id=k;s.append(new Option('Todos',''));[...new Set(books.flatMap(b=>b.tags[i].split(', ')))].sort().forEach(v=>s.append(new Option(v,v)));s.onchange=render;l.append(s);$('filters').append(l)});$('q').oninput=render;$('view').onchange=render;$('reset').onclick=()=>{$('q').value='';dimensions.forEach(([k])=>$(k).value='');render()};render()}catch(e){$('count').textContent='No se pudo cargar el inventario: '+e.message}}init();
</script></html>
